name: Cloud Pool Next Admission Contract

on:
  push:
    branches:
      - feat/cloud-pool-next-admission-contract-2026-11-15
  pull_request:
    paths:
      - "scripts/next-admission.mjs"
      - "test/next-admission.test.mjs"
      - ".github/workflows/next-admission-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.9.0
          check-latest: false
      - name: Syntax checks
        run: |
          node --check scripts/next-admission.mjs
          node --check test/next-admission.test.mjs
      - name: Adversarial admission tests
        run: node --test test/next-admission.test.mjs
