name: GitHub Actions Run Evidence Fixture Tests

on:
  pull_request:
    paths:
      - "proofs/github-actions-run-evidence-adapter/**"
      - ".github/workflows/github-actions-run-evidence-fixtures.yml"

permissions:
  contents: read

concurrency:
  group: github-actions-run-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run synthetic evidence fixtures
        working-directory: proofs/github-actions-run-evidence-adapter
        run: node --test
