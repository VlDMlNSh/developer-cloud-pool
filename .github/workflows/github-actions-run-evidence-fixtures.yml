name: GitHub Actions Run Evidence Fixture Tests

on:
  pull_request:
    paths:
      - "proofs/github-actions-run-evidence-adapter/**"
      - ".github/workflows/github-actions-run-evidence-fixtures.yml"

permissions:
  contents: read

concurrency:
  group: github-actions-run-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact dependency graph and run synthetic fixtures
        working-directory: proofs/github-actions-run-evidence-adapter
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          sha256sum package-lock.json
      - name: Upload committed package manifest and lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octokit-lockfile-verified
          path: |
            proofs/github-actions-run-evidence-adapter/package.json
            proofs/github-actions-run-evidence-adapter/package-lock.json
          if-no-files-found: error
          retention-days: 7
