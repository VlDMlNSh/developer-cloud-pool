name: D1 Atomic Admission Integration Proof

on:
  push:
    branches:
      - feat/atomic-next-admission-d1-2026-11-16
    paths:
      - "proofs/d1-admission/**"
      - ".github/workflows/d1-admission-integration-proof.yml"
  pull_request:
    branches:
      - "Основной"
    paths:
      - "proofs/d1-admission/**"
      - ".github/workflows/d1-admission-integration-proof.yml"

permissions:
  contents: read

jobs:
  d1-admission-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: proofs/d1-admission
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.9.0
          check-latest: false
      - name: Install exact declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check adapter syntax
        run: npm run check
      - name: Run local Workers-runtime D1 tests
        run: npm test
      - name: Upload dependency lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-admission-proof-package-lock
          path: proofs/d1-admission/package-lock.json
          if-no-files-found: error
          retention-days: 7
