name: Architecture Documentation Validation

on:
  pull_request:
    branches:
      - "Основной"
    paths:
      - "README.md"
      - "docs/architecture/CLOUD-POOL-REFERENCE-ARCHITECTURE-1.0.md"
      - "docs/architecture/CLOUD-POOL-UNIFIED-REALIZATION-MAP-2026-11-17.md"
      - "docs/decisions/2026-11-17-cloud-pool-architecture-consolidation-adr.md"
      - "docs/reports/2026-11-17-cloud-pool-architecture-consolidation.md"
      - "docs/checkpoints/2026-11-17-cloud-pool-architecture-consolidation.md"
      - "scripts/validate-architecture-docs.mjs"
      - ".github/workflows/architecture-documentation-validation.yml"

permissions:
  contents: read

concurrency:
  group: architecture-doc-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normative-links:
    name: Validate canonical architecture links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate normative Markdown links
        run: node scripts/validate-architecture-docs.mjs
