name: Runner Resource Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-resource-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only host resource inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect runner and resource facts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner Resource Probe"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner OS: $RUNNER_OS"
            echo "- Runner architecture: $RUNNER_ARCH"
            echo "- Image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
            echo
            echo "### CPU"
            echo '~~~text'
            lscpu
            echo '~~~'
            echo
            echo "### Memory"
            echo '~~~text'
            free -h
            echo '~~~'
            echo
            echo "### Filesystems"
            echo '~~~text'
            df -hT
            echo '~~~'
            echo
            echo "### OS"
            echo '~~~text'
            cat /etc/os-release
            uname -a
            echo '~~~'
            echo
            echo "### Tool versions"
            echo '~~~text'
            bash --version | head -n 1
            git --version
            python3 --version
            node --version || true
            npm --version || true
            echo '~~~'
            echo
            available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
            available_gib="$(awk -v kib="$available_kib" 'BEGIN {printf "%.2f", kib/1024/1024}')"
            echo "Available workspace filesystem: ${available_gib} GiB"
            if [ "$available_kib" -lt $((5 * 1024 * 1024)) ]; then
              echo "::warning::Less than 5 GiB available before profile installation."
            fi

            cpu_logical="$(getconf _NPROCESSORS_ONLN)"
            memory_total_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
            memory_available_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            disk_total_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $2}')"
            observed_at="$(date +%s)"
            valid_until="$((observed_at + 3600))"
            mkdir -p "$RUNNER_TEMP/runner-capacity"
            python3 - "$RUNNER_TEMP/runner-capacity/runner-capacity.json" "$cpu_logical" "$memory_total_kib" "$memory_available_kib" "$disk_total_kib" "$available_kib" "$observed_at" "$valid_until" <<'PY'
            import json, os, sys
            path, cpu, mem_total, mem_available, disk_total, disk_available, observed, valid_until = sys.argv[1:]
            payload = {
                "schema": "developer-cloud-pool.runner-capacity-probe.v1",
                "source": "github-actions-runner-resource-probe",
                "repository": os.environ["GITHUB_REPOSITORY"],
                "ref": os.environ["GITHUB_REF"],
                "commitSha": os.environ["GITHUB_SHA"],
                "runId": os.environ["GITHUB_RUN_ID"],
                "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                "runner": {
                    "os": os.environ.get("RUNNER_OS", "unknown"),
                    "architecture": os.environ.get("RUNNER_ARCH", "unknown"),
                    "imageOs": os.environ.get("ImageOS", "unknown"),
                    "imageVersion": os.environ.get("ImageVersion", "unknown")
                },
                "observedAt": int(observed),
                "validUntil": int(valid_until),
                "raw": {
                    "cpuLogical": int(cpu),
                    "memoryTotalMiB": int(mem_total) // 1024,
                    "memoryAvailableMiB": int(mem_available) // 1024,
                    "workspaceDiskTotalMiB": int(disk_total) // 1024,
                    "workspaceDiskAvailableMiB": int(disk_available) // 1024
                },
                "qualificationStatus": "not_qualified"
            }
            with open(path, "w", encoding="utf-8") as handle:
                json.dump(payload, handle, sort_keys=True, indent=2)
                handle.write("\\n")
            PY
            echo
            echo "### Machine-readable capacity snapshot"
            echo "- Artifact: runner-capacity-probe"
            echo "- Logical CPU: ${cpu_logical}"
            echo "- Memory available: $((memory_available_kib / 1024)) MiB"
            echo "- Workspace disk available: $((available_kib / 1024)) MiB"
            echo "- Snapshot expires at epoch: ${valid_until}"
            echo "> Observation only. This snapshot is not a qualified workload capacity profile."
            echo
            echo "> Read-only baseline. No agents are installed, no secrets are accessed, and no profile is qualified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable resource snapshot
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ba
        with:
          name: runner-capacity-probe
          path: ${{ runner.temp }}/runner-capacity/runner-capacity.json
          if-no-files-found: error
          retention-days: 3
