name: Claude Code + ECC + FCC Runner Qualification

on:
  pull_request:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/claude-code-fcc-runner-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-code-fcc-runner-qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-proof:
    name: No-secret install and resource proof
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout pool source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Create evidence directory and record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "GitHub event SHA: $GITHUB_SHA"
            echo "PR head SHA: $PR_HEAD_SHA"
            echo "PR base SHA: $PR_BASE_SHA"
            echo "Checked out SHA: $(git rev-parse HEAD)"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo
            lscpu
            free -h
            df -hT
            cat /etc/os-release
            node --version || true
            npm --version || true
            python3 --version
          } > "$RUNNER_TEMP/qualification/runner-baseline.txt"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$available_kib" -lt $((6 * 1024 * 1024)) ]; then
            echo "::error::Less than 6 GiB free before installation; refusing the profile proof."
            exit 2
          fi

      - name: Install pinned Claude Code with official native installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
          bash "$RUNNER_TEMP/claude-install.sh" 2.1.325
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if [ ! -x "$HOME/.local/bin/claude" ]; then
            find "$HOME/.local" "$HOME/.claude" -maxdepth 5 \( -type f -o -type l \) -name claude -print || true
          fi
          claude_bin="$HOME/.local/bin/claude"
          if [ ! -x "$claude_bin" ]; then
            claude_bin="$(find "$HOME/.local" "$HOME/.claude" -maxdepth 5 \( -type f -o -type l \) -name claude -print -quit 2>/dev/null || true)"
          fi
          test -n "$claude_bin"
          test -x "$claude_bin"
          echo "$(dirname "$claude_bin")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$claude_bin"):$PATH"
          installed_version="$(claude --version)"
          printf '%s\n' "$installed_version" | tee "$RUNNER_TEMP/qualification/claude-version.txt"
          test "$(printf '%s' "$installed_version" | awk '{print $1}')" = "2.1.325"
          claude --help > "$RUNNER_TEMP/qualification/claude-help.txt"
        env:
          DISABLE_AUTOUPDATER: "1"

      - name: Install pinned uv bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check "uv==0.13.7"
          echo "$RUNNER_TEMP/uv-bootstrap/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv-bootstrap/bin/uv" --version | tee "$RUNNER_TEMP/qualification/uv-version.txt"

      - name: Install and metadata-check FCC without starting its server
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/fcc-venv
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_NO_PROGRESS: "1"
        run: |
          set -euo pipefail
          fcc_commit="eb92e4c07af0d6ad8881dce1cd958c3d072c27c5"
          git clone --filter=blob:none https://github.com/Alishahryar1/free-claude-code.git "$RUNNER_TEMP/fcc-src"
          git -C "$RUNNER_TEMP/fcc-src" checkout --detach "$fcc_commit"
          test "$(git -C "$RUNNER_TEMP/fcc-src" rev-parse HEAD)" = "$fcc_commit"
          test "$(git -C "$RUNNER_TEMP/fcc-src" hash-object pyproject.toml)" = "5eed9ea28040cf54ca87e8f48b8ef38c5b33d80b"
          test "$(git -C "$RUNNER_TEMP/fcc-src" hash-object uv.lock)" = "ee8490c29a36f8302f5c1f1d42b465f6271c10f2"
          uv python install 3.14.10
          cd "$RUNNER_TEMP/fcc-src"
          /usr/bin/time -v -o "$RUNNER_TEMP/qualification/fcc-install-time.txt" uv sync --frozen --no-dev --python 3.14.10
          "$UV_PROJECT_ENVIRONMENT/bin/python" --version | tee "$RUNNER_TEMP/qualification/fcc-python-version.txt"
          test "$("$UV_PROJECT_ENVIRONMENT/bin/python" --version)" = "Python 3.14.10"
          "$UV_PROJECT_ENVIRONMENT/bin/fcc-server" --version | tee "$RUNNER_TEMP/qualification/fcc-server-version.txt"
          "$UV_PROJECT_ENVIRONMENT/bin/fcc-doctor" --version | tee "$RUNNER_TEMP/qualification/fcc-doctor-version.txt"

      - name: Start FCC on loopback and verify local readiness and shutdown
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/fcc-venv
          HOST: "127.0.0.1"
          PORT: "18765"
          FCC_OPEN_BROWSER: "false"
          PROVIDER_MAX_ATTEMPTS: "1"
          PROVIDER_MAX_CONCURRENCY: "1"
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/qualification/fcc-runtime-state.txt"
          log_file="$RUNNER_TEMP/qualification/fcc-server-runtime.log"
          listener_file="$RUNNER_TEMP/qualification/fcc-listener.txt"
          printf '%s\n' \
            'fcc_server_started=false' \
            'fcc_health_endpoint=NOT_RUN' \
            'fcc_listener=NOT_VERIFIED' \
            'fcc_shutdown=NOT_RUN' \
            > "$state_file"

          server_pid=""
          cleanup() {
            original_status=$?
            trap - EXIT
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -INT "$server_pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -TERM "$server_pid" 2>/dev/null || true
                for attempt in $(seq 1 5); do
                  if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                  sleep 1
                done
              fi
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
              printf '%s\\n' \
                'fcc_server_started=true' \
                'fcc_health_endpoint=NOT_VERIFIED' \
                'fcc_listener=NOT_VERIFIED' \
                'fcc_shutdown=cleanup_after_failure' \
                'fcc_process_cleanup_attempted=true' \
                > "$state_file"
            fi
            exit "$original_status"
          }
          trap cleanup EXIT

          cd "$RUNNER_TEMP/fcc-src"
          "$UV_PROJECT_ENVIRONMENT/bin/fcc-server" > "$log_file" 2>&1 &
          server_pid=$!
          printf '%s\n' \
            'fcc_server_started=true' \
            'fcc_health_endpoint=GET /admin/api/status (loopback-only)' \
            'fcc_listener=127.0.0.1:18765' \
            'fcc_shutdown=IN_PROGRESS' \
            > "$state_file"

          http_status="000"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::FCC exited before readiness."
              cat "$log_file"
              exit 1
            fi
            http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:18765/admin/api/status || true)"
            if [ "$http_status" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "$http_status" != "200" ]; then
            echo "::error::Source-verified loopback readiness endpoint did not return HTTP 200."
            cat "$log_file"
            exit 1
          fi

          listener_output="$(ss -H -ltn 'sport = :18765')"
          printf '%s\n' "$listener_output" > "$listener_file"
          listener_address="$(printf '%s\n' "$listener_output" | awk 'NF {print $4}')"
          if [ "$listener_address" != "127.0.0.1:18765" ] || [ "$(printf '%s\n' "$listener_output" | awk 'NF {count++} END {print count+0}')" -ne 1 ]; then
            echo "::error::FCC listener was not exactly 127.0.0.1:18765."
            cat "$listener_file"
            exit 1
          fi

          kill -INT "$server_pid"
          set +e
          wait "$server_pid"
          shutdown_status=$?
          set -e
          server_pid=""
          if [ "$shutdown_status" -ne 0 ]; then
            echo "::error::FCC did not exit cleanly after SIGINT (exit=$shutdown_status)."
            cat "$log_file"
            exit 1
          fi

          remaining_listener="$(ss -H -ltn 'sport = :18765')"
          if [ -n "$remaining_listener" ]; then
            echo "::error::FCC listener remained after shutdown."
            printf '%s\n' "$remaining_listener"
            exit 1
          fi

          printf '%s\n' \
            'fcc_server_started=true' \
            "fcc_health_http_status=$http_status" \
            'fcc_health_endpoint=GET /admin/api/status' \
            'fcc_listener=127.0.0.1:18765' \
            'fcc_shutdown=clean' \
            "fcc_process_exit_code=$shutdown_status" \
            'fcc_listener_after_shutdown=absent' \
            'provider_calls=false' \
            'completion_endpoints_called=false' \
            'fcc_client_launcher_invoked=false' \
            > "$state_file"
          trap - EXIT

      - name: Install only selected ECC skills at immutable upstream commit
        shell: bash
        run: |
          set -euo pipefail
          ecc_commit="e413166c50e85fb205b988b5e78874b5a88ea4d2"
          git clone --filter=blob:none https://github.com/affaan-m/ECC.git "$RUNNER_TEMP/ecc"
          git -C "$RUNNER_TEMP/ecc" checkout --detach "$ecc_commit"
          test "$(git -C "$RUNNER_TEMP/ecc" rev-parse HEAD)" = "$ecc_commit"
          mkdir -p "$HOME/.claude/skills"
          for skill in search-first tdd-workflow security-review; do
            test -f "$RUNNER_TEMP/ecc/skills/$skill/SKILL.md"
            mkdir -p "$HOME/.claude/skills/$skill"
            cp "$RUNNER_TEMP/ecc/skills/$skill/SKILL.md" "$HOME/.claude/skills/$skill/SKILL.md"
          done
          find "$HOME/.claude/skills" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/qualification/ecc-skill-sha256.txt"

      - name: Verify profile footprint and write provenance manifest
        if: always()
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/fcc-venv
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          {
            echo "## Final resource snapshot"
            free -h
            df -hT "$RUNNER_TEMP"
            echo
            echo "## Installed sizes"
            du -sh "$HOME/.local/share/claude" "$UV_PROJECT_ENVIRONMENT" "$UV_CACHE_DIR" "$HOME/.claude/skills" 2>/dev/null || true
          } > "$RUNNER_TEMP/qualification/runner-final.txt"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$available_kib" -lt $((2 * 1024 * 1024)) ]; then
            echo "::error::Less than 2 GiB remain after installation; profile is not resource-qualified."
            exit 3
          fi
          claude_version="NOT_INSTALLED"
          if command -v claude >/dev/null 2>&1; then
            claude_version="$(claude --version)"
          fi
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "target_sha=$PR_HEAD_SHA"
            echo "github_event_sha=$GITHUB_SHA"
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "base_sha=$PR_BASE_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "claude_code_version=$claude_version"
            echo "claude_code_install_method=official_native_installer"
            echo "fcc_repository=https://github.com/Alishahryar1/free-claude-code"
            echo "fcc_commit=eb92e4c07af0d6ad8881dce1cd958c3d072c27c5"
            echo "fcc_pyproject_git_blob=5eed9ea28040cf54ca87e8f48b8ef38c5b33d80b"
            echo "fcc_uv_lock_git_blob=ee8490c29a36f8302f5c1f1d42b465f6271c10f2"
            echo "fcc_python=3.14.10"
            echo "ecc_repository=https://github.com/affaan-m/ECC"
            echo "ecc_commit=e413166c50e85fb205b988b5e78874b5a88ea4d2"
            echo "ecc_skills=search-first,tdd-workflow,security-review"
            echo "provider_calls=false"
            echo "github_secret_values_read=false"
            echo "fcc_client_launcher_invoked=false"
            echo "agent_task_executed=false"
            echo "production_dispatch=false"
          } > "$RUNNER_TEMP/qualification/provenance-manifest.txt"
          if [ -f "$RUNNER_TEMP/qualification/fcc-runtime-state.txt" ]; then
            cat "$RUNNER_TEMP/qualification/fcc-runtime-state.txt" >> "$RUNNER_TEMP/qualification/provenance-manifest.txt"
          fi
          find "$RUNNER_TEMP/qualification" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/qualification/SHA256SUMS.txt"

      - name: Publish bounded no-secret qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: claude-code-fcc-ecc-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification/
          if-no-files-found: warn
          retention-days: 7
