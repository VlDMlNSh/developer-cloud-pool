name: Pool Worker

on:
  workflow_dispatch:
    inputs:
      task_issue:
        description: "Approved pool task issue number"
        required: true
        type: string
      target_sha:
        description: "Immutable 40-character target commit SHA"
        required: true
        type: string
      profile:
        description: "Allowlisted worker profile"
        required: true
        type: choice
        options:
          - dsh-headless-probe
      supervisor_run_id:
        description: "Pool Supervisor workflow run that consumed owner approval"
        required: true
        type: string

run-name: "Pool task #${{ inputs.task_issue }} (${{ inputs.profile }})"

concurrency:
  group: pool-worker-task-${{ inputs.task_issue }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate owner approval and supervisor provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TASK_ISSUE: ${{ inputs.task_issue }}
      TARGET_SHA: ${{ inputs.target_sha }}
      PROFILE: ${{ inputs.profile }}
      SUPERVISOR_RUN_ID: ${{ inputs.supervisor_run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout trusted workflow source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate one-time owner approval and trusted supervisor run
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            extractTaskEnvelope,
            hasConsumedOwnerApproval,
            hasSupervisorClaimComment,
            hasOwnerReadyEvent,
            hasCurrentBotClaimEvent,
            isTrustedSupervisorRun,
            hasPriorWorkerRun
          } from "./scripts/pool-approval.mjs";

          const repo = process.env.GITHUB_REPOSITORY;
          const [owner, name] = String(repo || "").split("/");
          const issueNumber = process.env.TASK_ISSUE;
          const targetSha = process.env.TARGET_SHA;
          const profile = process.env.PROFILE;
          const supervisorRunId = process.env.SUPERVISOR_RUN_ID;
          const defaultBranch = process.env.DEFAULT_BRANCH;
          const currentRunId = process.env.CURRENT_RUN_ID;

          if (!owner || !name || !/^\d+$/.test(issueNumber || "")) throw new Error("Invalid repository or task issue.");
          if (!/^[0-9a-f]{40}$/.test(targetSha || "")) throw new Error("Invalid immutable target SHA.");
          if (profile !== "dsh-headless-probe") throw new Error("Worker profile is not allowlisted.");
          if (!/^\d+$/.test(supervisorRunId || "")) throw new Error("A valid supervisor_run_id is required.");
          if (!defaultBranch || process.env.GITHUB_REF !== "refs/heads/" + defaultBranch) {
            throw new Error("Worker may run only from the repository default branch.");
          }

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + process.env.GITHUB_TOKEN,
            "X-GitHub-Api-Version": "2022-11-28"
          };
          async function get(path) {
            const response = await fetch("https://api.github.com/repos/" + repo + path, { headers });
            if (!response.ok) throw new Error("GitHub authorization evidence request failed with HTTP " + response.status);
            return response.json();
          }

          const [issue, comments, events, supervisorWorkflow, supervisorRun, workerRunData] = await Promise.all([
            get("/issues/" + issueNumber),
            get("/issues/" + issueNumber + "/comments?per_page=100"),
            get("/issues/" + issueNumber + "/events?per_page=100"),
            get("/actions/workflows/pool-supervisor.yml"),
            get("/actions/runs/" + supervisorRunId),
            get("/actions/workflows/pool-worker.yml/runs?per_page=100")
          ]);

          if (comments.length >= 100 || events.length >= 100 || (workerRunData.workflow_runs || []).length >= 100) {
            throw new Error("Authorization history exceeds the bounded first-page limit; refusing ambiguous evidence.");
          }
          if (issue.pull_request || issue.state !== "open") throw new Error("Task must be an open issue.");
          const labels = (issue.labels || []).map(label => typeof label === "string" ? label : label.name);
          if (!labels.includes("pool:claimed")) throw new Error("Task does not hold the current supervisor claim.");
          const envelope = extractTaskEnvelope(issue.body);
          if (!envelope || envelope.targetSha !== targetSha || envelope.profile !== "DSH headless probe") {
            throw new Error("Dispatch SHA/profile does not match the immutable task envelope.");
          }

          const expected = { issueNumber: Number(issueNumber), targetSha, profile: envelope.profile };
          const runExpected = {
            supervisorRunId,
            workflowId: supervisorWorkflow.id,
            repositoryOwner: owner,
            defaultBranch
          };
          if (!isTrustedSupervisorRun(supervisorRun, runExpected)) throw new Error("Supervisor run is not a trusted owner-triggered run.");
          if (!hasOwnerReadyEvent(events, owner, supervisorRun.created_at)) throw new Error("No matching recent owner pool:ready event exists for this supervisor run.");
          if (!hasCurrentBotClaimEvent(events, supervisorRun.created_at)) throw new Error("Current pool:claimed state was not applied by the supervisor.");
          if (!hasConsumedOwnerApproval(comments, expected, owner, supervisorRunId)) throw new Error("No matching single-use owner approval was consumed by this supervisor run.");
          if (!hasSupervisorClaimComment(comments, expected, supervisorRunId)) throw new Error("Supervisor claim receipt is missing or does not match this task.");
          if (hasPriorWorkerRun(workerRunData.workflow_runs || [], currentRunId, issueNumber, supervisorRun.created_at)) {
            throw new Error("A Worker run already exists for this owner approval; duplicate execution is refused.");
          }

          console.log("Worker authority verified: owner event, bot claim, consumed approval, supervisor run and one-shot execution all match.");
          NODE

  probe:
    name: Run isolated DSH headless smoke test
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact immutable target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.9.0
          check-latest: false

      - name: Install and inspect DSH headless composition
        shell: bash
        env:
          TASK_ISSUE: ${{ inputs.task_issue }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          prefix="$RUNNER_TEMP/dsh-pool-worker"
          home="$RUNNER_TEMP/dsh-pool-home"
          mkdir -p "$prefix" "$home"
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$free_kib" -lt $((6 * 1024 * 1024)) ]; then
            echo "::error::Less than 6 GiB free; refusing DSH installation."
            exit 2
          fi

          {
            echo "## Pool Worker — DSH headless probe"
            echo
            echo "- Task issue: #$TASK_ISSUE"
            echo "- Target SHA: $TARGET_SHA"
            echo "- Profile: dsh-headless-probe"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Provider credentials: none"
            echo "- Model call: none"
            echo
            echo "### Before installation"
            echo '~~~text'
            free -h
            df -hT "$RUNNER_TEMP"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          npm install --prefix "$prefix" --no-audit --no-fund "@deepseek-ai/dsh@0.2.1-rc.5"
          export PATH="$prefix/node_modules/.bin:$PATH"
          installed_version="$(node -p "require('$prefix/node_modules/@deepseek-ai/dsh/package.json').version")"
          test "$installed_version" = "0.2.1-rc.5"

          /usr/bin/time -v timeout 180s dsh --profile headless --dump-config \
            > "$RUNNER_TEMP/dsh-composition.txt" \
            2> "$RUNNER_TEMP/dsh-time.txt"

          composition_sha="$(sha256sum "$RUNNER_TEMP/dsh-composition.txt" | awk '{print $1}')"
          install_size="$(du -sh "$prefix/node_modules" | awk '{print $1}')"
          {
            echo
            echo "### Probe result"
            echo "- Installed DSH: $installed_version"
            echo "- node_modules footprint: $install_size"
            echo "- Composition SHA-256: $composition_sha"
            echo "- Model call: no"
            echo "- Secrets accessed: no"
            echo
            echo "### Runtime and memory"
            echo '~~~text'
            cat "$RUNNER_TEMP/dsh-time.txt"
            free -h
            df -hT "$RUNNER_TEMP"
            echo '~~~'
            echo
            echo "This probe does not qualify DSH for production or untrusted workloads."
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Record worker result without exposing runtime to write credentials
    if: always()
    needs: [validate, probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TASK_ISSUE: ${{ inputs.task_issue }}
      TARGET_SHA: ${{ inputs.target_sha }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      PROBE_RESULT: ${{ needs.probe.result }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Update task state and append audit comment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const issueNumber = process.env.TASK_ISSUE;
          if (process.env.VALIDATE_RESULT !== "success") {
            console.log("Validation failed; no issue mutation from the worker report job.");
            process.exit(0);
          }
          const token = process.env.GITHUB_TOKEN;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + token,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json"
          };
          const base = "https://api.github.com/repos/" + repo + "/issues/" + issueNumber;
          const get = await fetch(base, { headers });
          if (!get.ok) throw new Error("Cannot load issue for report: HTTP " + get.status);
          const issue = await get.json();
          const oldLabels = issue.labels.map(label => label.name);
          const managed = ["pool:ready", "pool:claimed", "pool:probe-complete", "pool:needs-review", "pool:invalid"];
          const retained = oldLabels.filter(label => !managed.includes(label));
          const success = process.env.PROBE_RESULT === "success";
          const terminal = success ? "pool:probe-complete" : "pool:needs-review";
          const patch = await fetch(base, {
            method: "PATCH",
            headers,
            body: JSON.stringify({ labels: [...new Set([...retained, terminal])] })
          });
          if (!patch.ok) throw new Error("Cannot update task state: HTTP " + patch.status);
          const body = [
            success ? "**POOL_DSH_PROBE_COMPLETE**" : "**POOL_DSH_PROBE_NEEDS_REVIEW**",
            "",
            "- Worker run: " + process.env.WORKFLOW_RUN_ID,
            "- Target SHA: " + process.env.TARGET_SHA,
            "- Validation: " + process.env.VALIDATE_RESULT,
            "- Probe job: " + process.env.PROBE_RESULT,
            "- Provider credentials: none",
            "- Production qualification: NOT CLAIMED"
          ].join("\n");
          const posted = await fetch(base + "/comments", {
            method: "POST",
            headers,
            body: JSON.stringify({ body })
          });
          if (!posted.ok) throw new Error("Cannot append task audit comment: HTTP " + posted.status);
          console.log("Task #" + issueNumber + " recorded as " + terminal + ".");
          NODE
