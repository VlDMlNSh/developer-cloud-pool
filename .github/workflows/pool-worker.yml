name: Pool Worker (legacy DSH profile retired)

on:
  workflow_dispatch:

run-name: Legacy DSH worker retired

permissions: {}

jobs:
  retired:
    name: Refuse unqualified legacy DSH execution
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail closed
        shell: bash
        run: |
          echo "::error::Legacy DSH worker is retired. No task was accepted or executed. Use only the future D1-admission-bound, qualified CODE executor."
          exit 1
