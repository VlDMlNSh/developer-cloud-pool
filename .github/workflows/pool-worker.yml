name: Pool Worker

on:
  workflow_call:
    inputs:
      task_issue:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      profile:
        required: true
        type: string

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: read
    env:
      TASK_ISSUE: ${{ inputs.task_issue }}
      TARGET_SHA: ${{ inputs.target_sha }}
      PROFILE: ${{ inputs.profile }}
      CALLER_REPOSITORY: ${{ github.repository }}
      CALLER_REPOSITORY_ID: ${{ github.repository_id }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CALLEE_REPOSITORY: ${{ job.workflow_repository }}
      CALLEE_FILE_PATH: ${{ job.workflow_file_path }}
      CALLEE_WORKFLOW_SHA: ${{ job.workflow_sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate caller/callee and claimed task
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const e = process.env;
          if (!/^\d+$/.test(e.TASK_ISSUE || "")) throw new Error("Invalid task issue.");
          if (!/^[0-9a-f]{40}$/.test(e.TARGET_SHA || "")) throw new Error("Invalid target SHA.");
          if (e.PROFILE !== "dsh-headless-probe") throw new Error("Profile is not allowlisted.");
          if (e.CALLER_REPOSITORY !== e.GITHUB_REPOSITORY) throw new Error("Caller repository mismatch.");
          if (!/^[0-9]+$/.test(e.CALLER_REPOSITORY_ID || "")) throw new Error("Caller repository ID missing.");
          if (!e.CALLER_WORKFLOW_REF.endsWith("/.github/workflows/pool-supervisor.yml@refs/heads/Основной")) throw new Error("Caller is not the protected default-branch Supervisor.");
          if (!/^[0-9a-f]{40}$/.test(e.CALLER_WORKFLOW_SHA || "")) throw new Error("Caller SHA missing.");
          if (e.CALLEE_REPOSITORY !== e.GITHUB_REPOSITORY) throw new Error("Callee repository mismatch.");
          if (e.CALLEE_FILE_PATH !== ".github/workflows/pool-worker.yml") throw new Error("Callee path mismatch.");
          if (!/^[0-9a-f]{40}$/.test(e.CALLEE_WORKFLOW_SHA || "")) throw new Error("Callee SHA missing.");
          const url = "https://api.github.com/repos/" + e.GITHUB_REPOSITORY + "/issues/" + e.TASK_ISSUE;
          const response = await fetch(url, { headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + e.GITHUB_TOKEN,
            "X-GitHub-Api-Version": "2022-11-28"
          }});
          if (!response.ok) throw new Error("Cannot read task: HTTP " + response.status);
          const issue = await response.json();
          const labels = (issue.labels || []).map(label => label.name);
          if (issue.pull_request || issue.state !== "open" || !labels.includes("pool:claimed")) throw new Error("Task is not an open claimed issue.");
          const sha = String(issue.body || "").match(/^### Target SHA\s*\r?\n+([0-9a-f]{40})\s*$/im);
          const profile = String(issue.body || "").match(/^### Worker profile\s*\r?\n+([^\r\n]+)\s*$/im);
          if (!sha || sha[1] !== e.TARGET_SHA) throw new Error("Target SHA mismatch.");
          if (!profile || profile[1].trim() !== "DSH headless probe") throw new Error("Issue profile mismatch.");
          console.log("Caller/callee identity and task validated.");
          NODE

  probe:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout immutable target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.9.0
          check-latest: false
      - name: Run isolated DSH headless smoke test
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$PROFILE" = "dsh-headless-probe"
          prefix="$RUNNER_TEMP/dsh-pool-worker"
          mkdir -p "$prefix"
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$free_kib" -lt $((6 * 1024 * 1024)) ]; then
            echo "::error::Less than 6 GiB free; refusing DSH installation."
            exit 2
          fi
          npm install --prefix "$prefix" --no-audit --no-fund "@deepseek-ai/dsh@0.2.1-rc.5"
          export PATH="$prefix/node_modules/.bin:$PATH"
          installed_version="$(node -p "require('$prefix/node_modules/@deepseek-ai/dsh/package.json').version")"
          test "$installed_version" = "0.2.1-rc.5"
          /usr/bin/time -v timeout 180s dsh --profile headless --dump-config > "$RUNNER_TEMP/dsh-composition.txt" 2> "$RUNNER_TEMP/dsh-time.txt"
          {
            echo "## Pool Worker — DSH headless probe"
            echo "- Target SHA: $TARGET_SHA"
            echo "- Profile: $PROFILE"
            echo "- Installed DSH: $installed_version"
            echo "- Provider credentials: none"
            echo "- Model call: none"
            echo '~~~text'
            cat "$RUNNER_TEMP/dsh-time.txt"
            free -h
            df -hT "$RUNNER_TEMP"
            echo '~~~'
            echo "This probe does not qualify DSH for production or untrusted workloads."
          } >> "$GITHUB_STEP_SUMMARY"
