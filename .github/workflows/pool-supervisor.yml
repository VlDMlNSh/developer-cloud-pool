name: Pool Supervisor

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, reopened, labeled]

run-name: Pool Supervisor (${{ github.event_name }})

permissions: {}

concurrency:
  group: developer-cloud-pool-supervisor
  queue: max

jobs:
  reconcile:
    name: Validate and consume one approved task
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      task_issue: ${{ steps.intake.outputs.task_issue }}
      target_sha: ${{ steps.intake.outputs.target_sha }}
      profile: ${{ steps.intake.outputs.profile }}
      envelope_digest: ${{ steps.intake.outputs.envelope_digest }}
      claim_generation: ${{ steps.intake.outputs.claim_generation }}
      run_id: ${{ steps.intake.outputs.run_id }}
      run_attempt: ${{ steps.intake.outputs.run_attempt }}
      envelope_digest: ${{ steps.intake.outputs.envelope_digest }}
      claim_generation: ${{ steps.intake.outputs.claim_generation }}
      run_id: ${{ steps.intake.outputs.run_id }}
      run_attempt: ${{ steps.intake.outputs.run_attempt }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POOL_DISPATCH_ENABLED: ${{ vars.POOL_DISPATCH_ENABLED }}
      POOL_AUTHORIZATION_CONTRACT_ACCEPTED: ${{ vars.POOL_AUTHORIZATION_CONTRACT_ACCEPTED }}
    steps:
      - name: Checkout supervisor code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate and claim one task
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pool-supervisor.mjs

  worker:
    name: Call reusable Pool Worker
    needs: reconcile
    if: needs.reconcile.outputs.task_issue != ''
    uses: ./.github/workflows/pool-worker.yml
    with:
      task_issue: ${{ needs.reconcile.outputs.task_issue }}
      target_sha: ${{ needs.reconcile.outputs.target_sha }}
      profile: ${{ needs.reconcile.outputs.profile }}
    permissions:
      contents: read
      issues: read

  finalize:
    name: Record terminal task result
    needs: [reconcile, worker]
    if: always() && needs.reconcile.outputs.task_issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TASK_ISSUE: ${{ needs.reconcile.outputs.task_issue }}
      TARGET_SHA: ${{ needs.reconcile.outputs.target_sha }}
      WORKER_RESULT: ${{ needs.worker.result }}
      SUPERVISOR_RUN_ID: ${{ needs.reconcile.outputs.run_id }}
      SUPERVISOR_RUN_ATTEMPT: ${{ needs.reconcile.outputs.run_attempt }}
      CLAIM_GENERATION: ${{ needs.reconcile.outputs.claim_generation }}
      ENVELOPE_DIGEST: ${{ needs.reconcile.outputs.envelope_digest }}
    steps:
      - name: Checkout finalizer code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set terminal state and append provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pool-finalizer-runner.mjs
