name: Pool Supervisor (legacy dispatch retired)

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

run-name: Pool Supervisor (retired heartbeat)

permissions:
  contents: read

concurrency:
  group: developer-cloud-pool-supervisor
  queue: max

jobs:
  heartbeat:
    name: Verify legacy dispatch remains retired
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      POOL_DISPATCH_ENABLED: ${{ vars.POOL_DISPATCH_ENABLED }}
    steps:
      - name: Checkout trusted supervisor code without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Enforce retired legacy dispatch state
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pool-supervisor.mjs
          node scripts/pool-supervisor.mjs
