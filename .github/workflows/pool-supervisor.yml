name: Pool Supervisor

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, reopened, labeled]

run-name: Pool Supervisor (${{ github.event_name }})

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: developer-cloud-pool-supervisor
  queue: max

jobs:
  reconcile:
    name: Reconcile approved task queue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POOL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
      POOL_MAX_DISPATCH: "20"
      POOL_DISPATCH_ENABLED: ${{ vars.POOL_DISPATCH_ENABLED }}
    steps:
      - name: Checkout supervisor code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate and run supervisor
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/pool-supervisor.mjs
          node scripts/pool-supervisor.mjs
