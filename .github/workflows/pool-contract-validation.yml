name: Pool Contract Validation

on:
  pull_request:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "dsh-runtime/**"
  push:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "dsh-runtime/**"

permissions:
  contents: read

concurrency:
  group: pool-contract-validation-dsh-lockgen-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow syntax and security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up pinned Node.js for lockfile generation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.9.0
          check-latest: false

      - name: Generate temporary DSH lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=45000 --prefix dsh-runtime --lockfile-version=3
          node -e 'const p=require("./dsh-runtime/package-lock.json"); if(p.lockfileVersion!==3 || p.packages[""].dependencies["@deepseek-ai/dsh"]!=="0.2.1-rc.5") process.exit(1); console.log("LOCKFILE_VALIDATED packages="+Object.keys(p.packages).length)'
          sha256sum dsh-runtime/package-lock.json

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-runtime-lockfile
          path: dsh-runtime/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Assert worker dispatch remains disabled
        shell: bash
        env:
          POOL_DISPATCH_ENABLED: ${{ vars.POOL_DISPATCH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${POOL_DISPATCH_ENABLED:-}" = "true" ]; then
            echo "::error::POOL_DISPATCH_ENABLED is true; validation refuses to proceed."
            exit 1
          fi
          echo "Dispatch gate: disabled or unset." >> "$GITHUB_STEP_SUMMARY"

      - name: Parse workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").sort.each { |path| YAML.parse_file(path); puts "YAML syntax OK: #{path}" }'

      - name: Validate pool security contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-pool-contract.mjs
