name: Pool Contract Validation

on:
  pull_request:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/architecture/GITHUB-FREE-TIER-WORKFLOW-CONTRACT.md"
      - "docs/reports/**"
      - "docs/checkpoints/**"
  push:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/architecture/GITHUB-FREE-TIER-WORKFLOW-CONTRACT.md"
      - "docs/reports/**"
      - "docs/checkpoints/**"

permissions:
  contents: read

concurrency:
  group: pool-contract-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow syntax and security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Assert worker dispatch remains disabled
        shell: bash
        env:
          POOL_DISPATCH_ENABLED: ${{ vars.POOL_DISPATCH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${POOL_DISPATCH_ENABLED:-}" != "false" ]; then
            echo "::error::POOL_DISPATCH_ENABLED must be explicitly false; unset or unexpected values are rejected."
            exit 1
          fi
          echo "Dispatch gate: explicitly false." >> "$GITHUB_STEP_SUMMARY"

      - name: Parse workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").sort.each { |path| YAML.parse_file(path); puts "YAML syntax OK: #{path}" }'

      - name: Validate GitHub Free-only runner policy
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/validate-free-tier-policy.rb
          ruby scripts/validate-free-tier-policy-test.rb

      - name: Validate pool security contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-pool-contract.mjs
