name: Pool Contract Validation

on:
  pull_request:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "config/**"
      - "docs/architecture/**"
  push:
    branches:
      - "Основной"
    paths:
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: pool-contract-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-agent-skills:
    name: Install and verify pinned Gemini CLI skills
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.9.0
          check-latest: false

      - name: Install and verify the curated skill pack
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/install-agent-skills.mjs
          node scripts/install-agent-skills.mjs "$GITHUB_WORKSPACE"
          test -s agent-skills-inventory.sha256
          expected="$(node -e 'const m=require("./config/agent-skills.lock.json"); console.log(m.sources.reduce((n,s)=>n+s.skills.length,0))')"
          actual="$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          test "$actual" = "$expected"
          {
            echo "## Agent skills installation validation"
            echo "- Expected skills: $expected"
            echo "- Installed skills: $actual"
            echo "- Inventory SHA-256: $(sha256sum agent-skills-inventory.sha256 | awk '{print $1}')"
            echo "- No credentials, model calls, or skill script execution."
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate workflow syntax and security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Assert worker dispatch remains disabled
        shell: bash
        env:
          POOL_DISPATCH_ENABLED: ${{ vars.POOL_DISPATCH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${POOL_DISPATCH_ENABLED:-}" = "true" ]; then
            echo "::error::POOL_DISPATCH_ENABLED is true; validation refuses to proceed."
            exit 1
          fi
          echo "Dispatch gate: disabled or unset." >> "$GITHUB_STEP_SUMMARY"

      - name: Parse workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").sort.each { |path| YAML.parse_file(path); puts "YAML syntax OK: #{path}" }'

      - name: Validate pool security contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-pool-contract.mjs
