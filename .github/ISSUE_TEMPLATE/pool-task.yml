name: Cloud Pool Task
description: Submit a bounded task for the GitHub-hosted pool supervisor.
title: "[POOL] "
body:
  - type: markdown
    attributes:
      value: |
        This intake supports only the allowlisted DSH, agent-browser headless smoke, and agent-skills bootstrap profiles.
        Do not put credentials, private keys, tokens, personal data, or arbitrary shell commands in this issue.
        An owner must review the request and apply the `pool:ready` label before dispatch.
  - type: input
    id: target_sha
    attributes:
      label: Target SHA
      description: Exact 40-character commit SHA from this repository.
      placeholder: "0123456789abcdef0123456789abcdef01234567"
    validations:
      required: true
  - type: dropdown
    id: worker_profile
    attributes:
      label: Worker profile
      options:
        - DSH headless probe
        - Agent-browser headless
        - Agent skills bootstrap
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Explain the bounded read-only smoke task. Browser profile may visit only its hard-coded public smoke target.
      placeholder: "Run the approved agent-skills bootstrap at the specified target SHA; do not execute skill-provided scripts."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the evidence that should be present in the worker summary.
      placeholder: |
        - Exact target SHA checked out
        - Pinned browser CLI and Chromium installed
        - Core skill and optional dogfood skill loaded
        - Harmless public smoke page opened and screenshot hashed
        - Browser session closed
        - No model call and no provider credentials
        - For skills profile: all pinned Gemini CLI skills installed and SHA-256 inventory recorded
    validations:
      required: true
